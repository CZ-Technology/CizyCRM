name: Sync upstream (a cada 3 releases)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar identidade do commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Decidir se é hora de sincronizar
        id: decide
        run: |
          UPSTREAM=$(curl -s https://api.github.com/repos/melgarafael/DeskcommCRM/releases | jq -r '.[].tag_name')
          ULTIMA_NO_FORK=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // empty')

          if [ -z "$ULTIMA_NO_FORK" ]; then
            ATRASADAS=$(echo "$UPSTREAM" | wc -l)
          else
            ATRASADAS=$(echo "$UPSTREAM" |$/q;p" | wc -l)
          fi
          ALVO=$(echo "$UPSTREAM" | head -1)

          echo "atrasadas=$ATRASADAS" >> "$GITHUB_OUTPUT"
          echo "alvo=$ALVO" >> "$GITHUB_OUTPUT"

      - name: Sincronizar e publicar release no fork
        if: steps.decide.outputs.atrasadas >= 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOK
        run: |
          ALVO="${{ steps.decide.outputs.alvo }}"
          git remote add upstream https://mmCRM.git
          git fetch upstream --tags
          git merge "$ALVO" --ff-only || git merge "$ALVO" -m "Sync upstream $ALVO"
          git push origin HEAD:main
          gh release create "$ALVO" --title "$ALVO" --notes "Sincronizado automaticamente do upstream (melgarafael/DeskcommCRM)."
